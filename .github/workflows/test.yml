name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: pre-commit/action@v3.0.1

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        preset: [debug, asan, ubsan, release]
    env:
      CC: ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}
      CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
    steps:
      - uses: actions/checkout@v4

      - name: install deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build gdb

      - name: configure
        run: make configure PRESET=${{ matrix.preset }}

      - name: build
        run: make build PRESET=${{ matrix.preset }}

      - name: test
        run: make test PRESET=${{ matrix.preset }}

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: configure
        run: cmake --preset windows-debug

      - name: build
        run: cmake --build --preset windows-debug

      - name: test
        run: ctest --preset windows-debug --output-on-failure

  install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: install deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: configure
        run: cmake --preset release -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/_install

      - name: build and install
        run: cmake --build --preset release --target install

      - name: build a find_package consumer
        run: |
          cmake -S test/install -B _build/install-consumer -G Ninja \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/_install
          cmake --build _build/install-consumer
          ./_build/install-consumer/consumer
